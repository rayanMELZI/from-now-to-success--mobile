name: Release

# Push a version tag (git tag v1.2.0 && git push origin v1.2.0) and this
# builds a signed APK and publishes it as a GitHub release. Installed apps
# find it through the releases API and update themselves.
#
# Run it by hand on a branch (Actions › Release › Run workflow) to try a build
# without releasing it: the APK is attached to the run as an artifact, and no
# phone ever sees it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Test builds only: backend URL (e.g. http://10.0.2.2:3000 for a local stack seen from the emulator)"
        required: false
        default: ""
      emulator:
        description: "Test builds only: also build for x86_64 so it runs on the emulator"
        type: boolean
        default: false
      perf_log:
        description: "Test builds only: log tab-switch timings to logcat (tag ReactNativeJS, prefix [perf])"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets exist
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret for $name — see README › Releases"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

      - name: Stamp the version from the tag
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - name: Point a test build at another backend
        if: github.ref_type != 'tag' && inputs.api_url != ''
        run: echo "EXPO_PUBLIC_API_URL=${{ inputs.api_url }}" >> "$GITHUB_ENV"

      - name: Turn on the timing probe for a test build
        if: github.ref_type != 'tag' && inputs.perf_log
        run: echo "EXPO_PUBLIC_PERF_LOG=1" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Allow plain http for a local test backend
        if: github.ref_type != 'tag' && startsWith(inputs.api_url, 'http://')
        run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Only the CPUs real phones use; a test build for the emulator adds x86_64.
          ARCHS: ${{ (github.ref_type != 'tag' && inputs.emulator) && 'arm64-v8a,armeabi-v7a,x86_64' || 'arm64-v8a,armeabi-v7a' }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures="$ARCHS" \
            -PFNTS_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PFNTS_STORE_PASSWORD="$STORE_PASSWORD" \
            -PFNTS_KEY_ALIAS="$KEY_ALIAS" \
            -PFNTS_KEY_PASSWORD="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.keystore"

      - name: Name the APK after the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="test-${GITHUB_SHA::7}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "fromNowToSuccess-$VERSION.apk"

      - name: Keep the test APK on the run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: fromNowToSuccess-*.apk
          retention-days: 7

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: fromNowToSuccess-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
